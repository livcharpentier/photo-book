<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Photo Book</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5B9BD5">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Comic+Neue:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #EAF2FA;
    --bg-soft: #D9E9F7;
    --paper: #FFFFFF;
    --paper-shadow: rgba(91,141,190,.22);
    --ink: #2C4257;
    --cream: #2C4257;
    --cream-dim: #7093AF;
    --amber: #5B9BD5;
    --amber-dim: #8FBCE3;
    --danger: #D97862;
    --line: rgba(44,66,87,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:'Comic Neue',sans-serif;min-height:100vh;}
  h1,h2,h3,.serif{font-family:'Baloo 2',sans-serif;}
  button{font-family:inherit;cursor:pointer;border:none;}
  input,select{font-family:inherit;}

  /* Sprocket strip — the one bold device, used once as a structural divider */
  .sprockets{
    width:22px;flex-shrink:0;background:var(--bg-soft);
    display:flex;flex-direction:column;align-items:center;
    padding:14px 0;gap:14px;overflow:hidden;
  }
  .sprockets span{width:8px;height:8px;border-radius:2px;background:rgba(44,66,87,0.15);flex-shrink:0;}

  .app{display:flex;min-height:100vh;}

  .sidebar{
    width:260px;flex-shrink:0;background:var(--bg-soft);padding:28px 20px;
    display:flex;flex-direction:column;gap:18px;
  }
  .brand{display:flex;flex-direction:column;gap:2px;margin-bottom:8px;}
  .brand .kicker{font-size:12.5px;color:var(--amber);letter-spacing:.02em;}
  .brand h1{font-size:22px;margin:0;font-weight:600;}

  .new-album{
    background:transparent;border:1px solid var(--amber-dim);color:var(--amber);
    padding:10px 14px;border-radius:3px;font-size:14px;font-weight:500;
    transition:background .15s;
  }
  .new-album:hover{background:rgba(216,162,63,0.1);}

  .album-list{display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
  .album-item{
    padding:11px 12px;border-radius:3px;font-size:14.5px;color:var(--cream-dim);
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    border-left:2px solid transparent;
  }
  .album-item:hover{background:rgba(44,66,87,0.05);}
  .album-item.active{background:rgba(216,162,63,0.12);border-left-color:var(--amber);color:var(--cream);}
  .album-item .count{font-size:12px;color:var(--cream-dim);opacity:.8;}
  .album-item .del{opacity:0;background:none;color:var(--danger);font-size:16px;padding:2px 4px;}
  .album-item:hover .del{opacity:.7;}
  .album-item .del:hover{opacity:1;}

  .empty-sidebar{color:var(--cream-dim);font-size:13.5px;line-height:1.5;padding:8px 4px;}

  .main{flex:1;padding:36px 44px;overflow-y:auto;}
  .main-empty{
    height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--cream-dim);gap:10px;text-align:center;
  }
  .main-empty h2{color:var(--cream);font-weight:500;}

  .toolbar{
    display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;
    margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--line);
  }
  .toolbar h2{margin:0 0 4px;font-size:26px;font-weight:500;}
  .toolbar .meta{color:var(--cream-dim);font-size:13.5px;}
  .toolbar-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11.5px;color:var(--cream-dim);text-transform:uppercase;letter-spacing:.04em;}
  select{
    background:var(--bg);color:var(--cream);border:1px solid var(--line);
    padding:8px 10px;border-radius:3px;font-size:13.5px;
  }

  .btn{
    padding:9px 16px;border-radius:3px;font-size:13.5px;font-weight:500;
    display:inline-flex;align-items:center;gap:7px;
  }
  .btn-amber{background:var(--amber);color:#fff;}
  .btn-amber:hover{background:#4A8BC4;}
  .btn-ghost{background:transparent;color:var(--cream);border:1px solid var(--line);}
  .btn-ghost:hover{background:rgba(44,66,87,0.06);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .drop-zone{
    border:1.5px dashed var(--line);border-radius:6px;padding:26px;text-align:center;
    color:var(--cream-dim);font-size:13.5px;margin-bottom:32px;transition:border-color .15s, background .15s;
    cursor:pointer;
  }
  .drop-zone.drag-over{border-color:var(--amber);background:rgba(216,162,63,0.06);}
  .drop-zone strong{color:var(--amber);font-weight:500;}

  /* Pages — each rendered as a literal paper sheet */
  .pages{display:flex;flex-direction:column;gap:36px;}
  .page-block{display:flex;flex-direction:column;gap:8px;}
  .page-label{font-size:12px;color:var(--cream-dim);letter-spacing:.03em;}
  .page{
    background:var(--paper);color:var(--ink);border-radius:2px;
    box-shadow:0 10px 28px var(--paper-shadow);
    padding:0;display:grid;gap:2mm;
    aspect-ratio: var(--page-ratio, 210/297);
    max-width:520px;
    overflow:hidden;
  }
  .fmt-carre .page{ --page-ratio: 1/1; }

  .cover-page{ position:relative; padding:0; }
  .cover-title{
    position:absolute; left:0; right:0; bottom:0;
    font-family:'Baloo 2',sans-serif; font-weight:700; text-align:center;
    color:#fff; font-size:clamp(16px, 4vw, 28px); line-height:1.2;
    padding:14px 10px; background:linear-gradient(transparent, rgba(44,66,87,0.82) 55%);
  }

  /* Clean, edge-to-edge photos with just a thin gap between them — no
     individual white border, photo panels bleed to the page edge. */
  .cell{
    position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  .cell img{width:100%;height:100%;object-fit:cover;display:block;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;}
  .cell[data-photo-id]{touch-action:none;}
  .cell-empty{background:rgba(44,66,87,0.06);}
  .cell.dragging{opacity:.35;}
  .cell.drag-over{outline:2px solid var(--amber-dim);outline-offset:-2px;}
  .cell.selected{outline:3px solid var(--amber);outline-offset:-3px;}
  .cell .rm{
    position:absolute;top:4px;right:4px;background:rgba(44,66,87,0.72);color:#fff;
    width:22px;height:22px;border-radius:50%;font-size:13px;line-height:1;opacity:0;
    display:flex;align-items:center;justify-content:center;transition:opacity .12s;
  }
  .cell:hover .rm{opacity:1;}
  .cell{cursor:grab;}

  .page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .page-select{
    background:var(--bg);color:var(--cream-dim);border:1px solid var(--line);
    padding:5px 8px;border-radius:3px;font-size:12px;
  }
  .btn-add-photo{
    background:transparent;color:var(--amber);border:1px solid var(--amber-dim);
    padding:5px 10px;border-radius:3px;font-size:12px;font-weight:500;
  }
  .btn-add-photo:hover{background:rgba(216,162,63,0.1);}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--bg-soft);color:var(--cream);padding:11px 18px;border-radius:4px;
    font-size:13.5px;border:1px solid var(--line);opacity:0;pointer-events:none;transition:opacity .2s;
    z-index:50;
  }
  .toast.show{opacity:1;}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;
    align-items:center;justify-content:center;z-index:100;
  }
  .modal-backdrop.show{display:flex;}
  .modal{
    background:var(--bg-soft);border:1px solid var(--line);border-radius:6px;
    padding:26px;width:340px;
  }
  .modal h3{margin:0 0 16px;font-weight:500;font-size:17px;}
  .modal input[type=text]{
    width:100%;background:var(--bg);color:var(--cream);border:1px solid var(--line);
    padding:10px 12px;border-radius:3px;font-size:14px;margin-bottom:18px;
  }
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;}

  @media (max-width: 760px){
    .sidebar{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .2s;width:240px;}
    .sidebar.open{transform:translateX(0);}
    .main{padding:24px 18px;}
    .sprockets{display:none;}
    .menu-btn{display:flex !important;}
  }
  .menu-btn{display:none;background:none;color:var(--cream);font-size:22px;padding:4px 8px;}

  .logout-btn{
    margin-top:auto;background:none;color:var(--cream-dim);font-size:12.5px;
    text-align:left;padding:8px 4px;
  }
  .logout-btn:hover{color:var(--cream);}
  .sidebar{ } /* keep flex column so logout-btn margin-top:auto sticks to bottom */

  .login-screen{
    display:none;position:fixed;inset:0;background:var(--bg);
    align-items:center;justify-content:center;z-index:200;
  }
  .login-screen.show{display:flex;}
  .login-box{
    width:300px;display:flex;flex-direction:column;gap:12px;
  }
  .login-box input{
    background:var(--bg-soft);color:var(--cream);border:1px solid var(--line);
    padding:11px 13px;border-radius:3px;font-size:14px;
  }
  .login-error{color:var(--danger);font-size:13px;min-height:16px;}

</style>
</head>
<body>

<div class="app">
  <div class="sidebar" id="sidebar">
    <div class="brand">
      <span class="kicker">Photo Book</span>
      <h1>Mes albums</h1>
    </div>
    <button class="new-album" id="btnNewAlbum">+ Nouvel album</button>
    <div class="album-list" id="albumList"></div>
    <button class="logout-btn" id="logoutBtn">Se déconnecter</button>
  </div>

  <div class="sprockets" id="sprockets"></div>

  <div class="main">
    <button class="menu-btn" id="menuBtn">☰</button>
    <div id="mainContent"></div>
  </div>
</div>

<div class="login-screen" id="loginScreen">
  <form class="login-box" id="loginForm">
    <div class="brand" style="margin-bottom:20px;">
      <span class="kicker">Photo Book</span>

    </div>
    <input type="email" id="loginEmail" placeholder="Email" autocomplete="username" required>
    <input type="password" id="loginPassword" placeholder="Mot de passe" autocomplete="current-password" required>
    <div class="login-error" id="loginError"></div>

</div>

    <input type="text" id="newAlbumName" placeholder="Ex : Vacances Bretagne 2026" maxlength="60">
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelNewAlbum">Annuler</button>
      <button class="btn btn-amber" id="confirmNewAlbum">Créer</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="shareImportBackdrop">
  <div class="modal">
    <h3 id="shareImportTitle">Photos partagées</h3>
    <div class="field" style="margin-bottom:18px;">
      <label>Ajouter à l'album</label>
      <select id="shareImportAlbum" style="width:100%;padding:10px 12px;"></select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="shareImportCancel">Ignorer</button>
      <button class="btn btn-amber" id="shareImportConfirm">Importer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="image/*" multiple style="display:none">

<script>
/* ---------- Storage layer (IndexedDB) ----------
   V1 stores everything locally in the browser. This is intentional for now:
   it works immediately with zero setup. The next iteration swaps this module
   for Supabase (storage bucket + tables) so albums sync across devices and
   survive a browser reset — the rest of the app won't need to change. */
/* ---------- Storage layer (Supabase) ----------
   Albums and photo metadata live in Postgres tables; the original photo
   files live in the "photos" storage bucket. Both are protected by Row
   Level Security restricted to authenticated users — see supabase-setup.sql
   for the exact policies. Without logging in, the anon key embedded in this
   page can't read or write anything. */
const SUPABASE_URL = 'https://hkeokfujfgaltpkqcesj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_hH7UeIhNMNPW-zd5VeFQWw_JXOAVrZ1';
let supabaseClient;

function initSupabaseClient(){
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}

function albumFromRow(row){
  return { id: row.id, name: row.name, createdAt: row.created_at, format: row.format, pageLayouts: row.page_layouts || [] };
}
function photoFromRow(row){
  return { id: row.id, albumId: row.album_id, storagePath: row.storage_path, thumb: row.thumb, takenAt: row.taken_at, order: row.order_index, name: row.name };
}

async function listAlbums(){
  const { data, error } = await supabaseClient.from('albums').select('*').order('created_at', {ascending:false});
  if(error) throw error;
  return data.map(albumFromRow);
}
async function createAlbum(name){
  const { data, error } = await supabaseClient.from('albums').insert({
    name, created_at: Date.now(), format: 'a4', page_layouts: []
  }).select().single();
  if(error) throw error;
  return albumFromRow(data);
}
async function updateAlbum(album){
  const { error } = await supabaseClient.from('albums').update({
    format: album.format, page_layouts: album.pageLayouts
  }).eq('id', album.id);
  if(error) throw error;
}
async function deleteAlbum(id){
  // Remove the actual files from storage first — deleting the album row
  // only cascades the metadata rows, not the bucket contents.
  const { data: files } = await supabaseClient.storage.from('photos').list(id);
  if(files && files.length){
    await supabaseClient.storage.from('photos').remove(files.map(f => `${id}/${f.name}`));
  }
  const { error } = await supabaseClient.from('albums').delete().eq('id', id);
  if(error) throw error;
}
async function listPhotos(albumId){
  const { data, error } = await supabaseClient.from('photos').select('*').eq('album_id', albumId).order('order_index');
  if(error) throw error;
  return data.map(photoFromRow);
}
async function addPhoto(photo){
  const ext = (photo.name.split('.').pop() || 'jpg').toLowerCase();
  const storagePath = `${photo.albumId}/${photo.id}.${ext}`;
  const { error: uploadError } = await supabaseClient.storage.from('photos').upload(storagePath, photo.blob);
  if(uploadError) throw uploadError;
  const { error } = await supabaseClient.from('photos').insert({
    id: photo.id, album_id: photo.albumId, storage_path: storagePath,
    thumb: photo.thumb, taken_at: photo.takenAt, order_index: photo.order, name: photo.name
  });
  if(error) throw error;
}
async function deletePhoto(id){
  const { data: row } = await supabaseClient.from('photos').select('storage_path').eq('id', id).single();
  if(row) await supabaseClient.storage.from('photos').remove([row.storage_path]);
  const { error } = await supabaseClient.from('photos').delete().eq('id', id);
  if(error) throw error;
}
async function reorderPhotos(photos){
  await Promise.all(photos.map((p, i) =>
    supabaseClient.from('photos').update({ order_index: i }).eq('id', p.id)
  ));
}
async function downloadPhotoBlob(photo){
  const { data, error } = await supabaseClient.storage.from('photos').download(photo.storagePath);
  if(error) throw error;
  return data;
}

/* ---------- Layout templates ----------
   Each template is a grid of `cols` x `rows` cells; each slot spans
   [colStart, colEnd, rowStart, rowEnd] on that grid (1-based, end exclusive —
   same convention as CSS grid-column/grid-row). Slots are listed in the order
   photos should fill them (the emphasis slot first). This gives Cheerz-style
   asymmetric layouts instead of plain uniform grids. */
const TEMPLATES = {
  '1a': { label: '1 photo — pleine page', cols:1, rows:1,
    slots:[[1,2,1,2]] },

  '2a': { label: '2 photos — côte à côte', cols:2, rows:1,
    slots:[[1,2,1,2],[2,3,1,2]] },
  '2b': { label: '2 photos — grande + petite', cols:1, rows:3,
    slots:[[1,2,1,3],[1,2,3,4]] },

  '3a': { label: '3 photos — grande à gauche', cols:3, rows:2,
    slots:[[1,3,1,3],[3,4,1,2],[3,4,2,3]] },
  '3b': { label: '3 photos — grande en haut', cols:2, rows:3,
    slots:[[1,3,1,3],[1,2,3,4],[2,3,3,4]] },

  '4a': { label: '4 photos — grille égale', cols:2, rows:2,
    slots:[[1,2,1,2],[2,3,1,2],[1,2,2,3],[2,3,2,3]] },
  '4b': { label: '4 photos — grande + 3', cols:3, rows:3,
    slots:[[1,3,1,4],[3,4,1,2],[3,4,2,3],[3,4,3,4]] },

  '5a': { label: '5 photos — grande + 4', cols:3, rows:2,
    slots:[[1,2,1,3],[2,3,1,2],[3,4,1,2],[2,3,2,3],[3,4,2,3]] },

  '6a': { label: '6 photos — grille égale', cols:3, rows:2,
    slots:[[1,2,1,2],[2,3,1,2],[3,4,1,2],[1,2,2,3],[2,3,2,3],[3,4,2,3]] },

  '7a': { label: '7 photos — mosaïque', cols:4, rows:3,
    slots:[[1,3,1,3],[3,4,1,2],[4,5,1,2],[3,4,2,3],[4,5,2,3],[1,3,3,4],[3,5,3,4]] },

  '8a': { label: '8 photos — grille égale', cols:4, rows:2,
    slots:[[1,2,1,2],[2,3,1,2],[3,4,1,2],[4,5,1,2],[1,2,2,3],[2,3,2,3],[3,4,2,3],[4,5,2,3]] }
};
const DEFAULT_TEMPLATE = '4a';
// Auto-variety rotation for pages the person hasn't explicitly customized —
// cycles through different photo counts/structures instead of repeating the
// same grid every page ("panaché" of 2 to 6+ photos, as requested).
const DEFAULT_ROTATION = ['3a','2a','4b','5a','2b','6a','4a','3b'];

/* ---------- Photo orientation (portrait vs. landscape) ----------
   Detected from the thumbnail's actual pixel dimensions (not EXIF, which
   can lie about orientation after rotation) so photo-to-slot matching works
   for every photo regardless of when it was uploaded. Cached per photo id
   since decoding the same data URL repeatedly on every render is wasteful. */
const orientationCache = new Map();
function detectOrientation(photo){
  if(orientationCache.has(photo.id)) return Promise.resolve(orientationCache.get(photo.id));
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const o = img.naturalWidth >= img.naturalHeight ? 'landscape' : 'portrait';
      orientationCache.set(photo.id, o);
      resolve(o);
    };
    img.onerror = () => { orientationCache.set(photo.id, 'landscape'); resolve('landscape'); };
    img.src = photo.thumb;
  });
}
async function annotateOrientations(photos){
  const os = await Promise.all(photos.map(detectOrientation));
  return photos.map((p, i) => ({ ...p, orientation: os[i] }));
}


function templateOptionsHtml(selected){
  const groups = {};
  Object.entries(TEMPLATES).forEach(([id, t]) => {
    const count = t.slots.length;
    (groups[count] = groups[count] || []).push([id, t]);
  });
  return Object.keys(groups).sort((a,b)=>a-b).map(count =>
    groups[count].map(([id, t]) =>
      `<option value="${id}" ${id===selected?'selected':''}>${t.label}</option>`
    ).join('')
  ).join('');
}

function pageAspectFor(format){
  const d = PAGE_DIMS[format];
  return d.w / d.h;
}
// Physical shape of a slot once the page's real aspect ratio is taken into
// account — a slot that looks "wide" in grid units can still be a portrait
// rectangle in mm depending on the page format.
function slotShape(template, slot, pageAspect){
  const [c0,c1,r0,r1] = slot;
  const wFrac = (c1-c0) / template.cols;
  const hFrac = (r1-r0) / template.rows;
  const physW = wFrac * pageAspect;
  const physH = hFrac;
  return physW >= physH ? 'landscape' : 'portrait';
}
function templateShapeCounts(template, pageAspect){
  let portrait = 0, landscape = 0;
  template.slots.forEach(slot => {
    if(slotShape(template, slot, pageAspect) === 'portrait') portrait++; else landscape++;
  });
  return { portrait, landscape };
}
// How well a template's slot shapes fit the next photos in line, as a 0–1
// fraction of slots that would get their preferred orientation. Used to pick
// which layout to use next, instead of only reshuffling within a fixed one.
function scoreTemplateFit(template, upcomingPhotos, pageAspect){
  const n = template.slots.length;
  const slice = upcomingPhotos.slice(0, n);
  if(slice.length === 0) return -1;
  const portraitAvail = slice.filter(p => p.orientation === 'portrait').length;
  const landscapeAvail = slice.length - portraitAvail;
  const { portrait: pNeed, landscape: lNeed } = templateShapeCounts(template, pageAspect);
  const matched = Math.min(pNeed, portraitAvail) + Math.min(lNeed, landscapeAvail);
  return matched / n;
}
// Matches photos to a page's slots by shape (portrait photos into portrait
// slots, landscape into landscape) while preserving each orientation's own
// chronological order — falls back to whichever photos remain if one
// orientation runs out.
function assignPhotosToSlots(slicePhotos, template, pageAspect){
  const portraitQ = slicePhotos.filter(p => p.orientation === 'portrait');
  const landscapeQ = slicePhotos.filter(p => p.orientation !== 'portrait');
  let pi = 0, li = 0;
  return template.slots.map(slot => {
    const wantsPortrait = slotShape(template, slot, pageAspect) === 'portrait';
    if(wantsPortrait){
      if(pi < portraitQ.length) return portraitQ[pi++];
      if(li < landscapeQ.length) return landscapeQ[li++];
    }else{
      if(li < landscapeQ.length) return landscapeQ[li++];
      if(pi < portraitQ.length) return portraitQ[pi++];
    }
    return undefined;
  });
}

// Given the photo order (with orientation already detected) and the album's
// explicit per-page template choices, return one template id per page. Page
// 1 is always a fixed "cover" page (album title + the first photo
// chronologically). Pages after that use the explicit per-page choices where
// set; any photos not yet covered get a template picked automatically —
// scored against the upcoming photos' portrait/landscape mix rather than
// just cycling blindly, so a run of portrait photos gets a portrait-heavy
// layout instead of being force-fit into landscape slots.
function computeEffectiveLayouts(album, photos){
  const totalPhotos = photos.length;
  if(totalPhotos === 0) return ['cover'];
  const layouts = ['cover'];
  let covered = 1; // the cover page consumes the first photo
  const chosen = album.pageLayouts || [];
  for(const tid of chosen){
    if(covered >= totalPhotos) break;
    layouts.push(tid);
    covered += TEMPLATES[tid].slots.length;
  }
  const pageAspect = pageAspectFor(album.format);
  let lastPicked = null;
  while(covered < totalPhotos){
    const remaining = photos.slice(covered);
    let bestId = null, bestScore = -1;
    for(const tid of DEFAULT_ROTATION){
      if(tid === lastPicked) continue; // avoid the exact same layout twice in a row
      const score = scoreTemplateFit(TEMPLATES[tid], remaining, pageAspect);
      if(score > bestScore){ bestScore = score; bestId = tid; }
    }
    if(bestId === null) bestId = DEFAULT_ROTATION.find(t => t !== lastPicked) || DEFAULT_ROTATION[0];
    layouts.push(bestId);
    covered += TEMPLATES[bestId].slots.length;
    lastPicked = bestId;
  }
  return layouts;
}

/* ---------- EXIF-lite date reader ----------
   Reads the DateTimeOriginal (or fallback DateTime) tag straight out of the
   JPEG's EXIF block, without pulling in a library. Falls back to the file's
   last-modified date for formats without EXIF (PNG, HEIC, screenshots…). */
async function getPhotoDate(file){
  try{
    if(file.type === 'image/jpeg' || file.type === 'image/jpg'){
      const exifDate = await readJpegExifDate(file);
      if(exifDate) return exifDate;
    }
  }catch(e){ /* fall through to lastModified */ }
  return file.lastModified || Date.now();
}

function readJpegExifDate(file){
  return file.slice(0, 131072).arrayBuffer().then(buf => {
    const view = new DataView(buf);
    if(view.getUint16(0) !== 0xFFD8) return null;
    let offset = 2;
    while(offset < view.byteLength - 4){
      if(view.getUint16(offset) !== 0xFFE1){
        offset += 2 + view.getUint16(offset + 2);
        continue;
      }
      const tiffStart = offset + 10; // skip marker(2) + length(2) + "Exif\0\0"(6)
      if(view.getUint32(tiffStart - 6) !== 0x45786966) return null; // "Exif"
      const little = view.getUint16(tiffStart) === 0x4949;
      const getU16 = (o) => view.getUint16(o, little);
      const getU32 = (o) => view.getUint32(o, little);
      const firstIFD = tiffStart + getU32(tiffStart + 4);
      const date = scanIFDForDate(view, tiffStart, firstIFD, little, getU16, getU32);
      return date;
    }
    return null;
  }).catch(() => null);
}

function scanIFDForDate(view, tiffStart, ifdOffset, little, getU16, getU32){
  const entries = getU16(ifdOffset);
  let exifSubIFD = null;
  for(let i=0;i<entries;i++){
    const entryOffset = ifdOffset + 2 + i*12;
    const tag = getU16(entryOffset);
    if(tag === 0x8769){ // ExifIFD pointer
      exifSubIFD = tiffStart + getU32(entryOffset + 8);
    }
    if(tag === 0x0132){ // DateTime (fallback, IFD0)
      const valOffset = tiffStart + getU32(entryOffset + 8);
      const str = readAsciiAt(view, valOffset, 19);
      const parsed = parseExifDateString(str);
      if(parsed) return parsed; // keep looking for the more precise tag below
    }
  }
  if(exifSubIFD != null){
    const subEntries = getU16(exifSubIFD);
    for(let i=0;i<subEntries;i++){
      const entryOffset = exifSubIFD + 2 + i*12;
      const tag = getU16(entryOffset);
      if(tag === 0x9003 || tag === 0x9004){ // DateTimeOriginal / DateTimeDigitized
        const valOffset = tiffStart + getU32(entryOffset + 8);
        const str = readAsciiAt(view, valOffset, 19);
        const parsed = parseExifDateString(str);
        if(parsed) return parsed;
      }
    }
  }
  return null;
}
function readAsciiAt(view, offset, len){
  let s = '';
  for(let i=0;i<len;i++){
    const c = view.getUint8(offset+i);
    if(c === 0) break;
    s += String.fromCharCode(c);
  }
  return s;
}
function parseExifDateString(str){
  // Format: "YYYY:MM:DD HH:MM:SS"
  const m = /^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/.exec(str);
  if(!m) return null;
  const [, y, mo, d, h, mi, s] = m.map(Number);
  const t = new Date(y, mo-1, d, h, mi, s).getTime();
  return isNaN(t) ? null : t;
}

/* ---------- Image helpers ---------- */
function fileToImageBitmap(file){
  return createImageBitmap(file);
}
// Resize into a data URL for on-screen preview (keeps the app fast).
async function makeThumbnail(file, maxDim = 900){
  const bitmap = await fileToImageBitmap(file);
  const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
  const w = Math.round(bitmap.width * scale), h = Math.round(bitmap.height * scale);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
  return canvas.toDataURL('image/jpeg', 0.85);
}
// Resize for print export — larger target, since this ends up on paper.
async function makePrintImage(blob, maxDim = 1800){
  const bitmap = await createImageBitmap(blob);
  const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
  const w = Math.round(bitmap.width * scale), h = Math.round(bitmap.height * scale);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
  return { dataUrl: canvas.toDataURL('image/jpeg', 0.92), w, h };
}

/* ---------- State ---------- */
let currentAlbumId = null;

/* ---------- Photo drag-to-swap AND tap-to-swap (pointer events — works with touch AND mouse) ----------
   Native HTML5 drag-and-drop (draggable="true") only fires on desktop mice;
   on a phone, a long-press on an <img> instead opens the browser's own
   "save/share image" menu. Pointer Events unify touch and mouse, so this
   implements both gestures manually:
   - A real drag (the finger/mouse moves) swaps with whatever cell is under
     the release point, as before.
   - A simple tap (no movement) instead selects the photo; tapping a second
     photo swaps the two; tapping the same one again deselects it — easier
     to do reliably on a phone than a sustained drag. */
let dragState = null; // { photoId, sourceCell, startX, startY, moved }
let selectedPhotoId = null;
const DRAG_MOVE_THRESHOLD = 8; // px before a press counts as a drag rather than a tap

function clearSelection(){
  selectedPhotoId = null;
  document.querySelectorAll('.cell.selected').forEach(c => c.classList.remove('selected'));
}

function attachDragHandlers(cell, photoId){
  cell.addEventListener('pointerdown', (e) => {
    if(e.target.closest('.rm')) return;
    dragState = { photoId, sourceCell: cell, startX: e.clientX, startY: e.clientY, moved: false };
    cell.classList.add('dragging');
  });
}

document.addEventListener('pointermove', (e) => {
  if(!dragState) return;
  const dx = e.clientX - dragState.startX, dy = e.clientY - dragState.startY;
  if(Math.hypot(dx, dy) > DRAG_MOVE_THRESHOLD) dragState.moved = true;
  if(!dragState.moved) return;
  e.preventDefault();
  document.querySelectorAll('.cell.drag-over').forEach(c => c.classList.remove('drag-over'));
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const targetCell = el && el.closest('.cell');
  if(targetCell && targetCell !== dragState.sourceCell && targetCell.dataset.photoId){
    targetCell.classList.add('drag-over');
  }
}, { passive: false });

document.addEventListener('pointerup', async (e) => {
  if(!dragState) return;
  const { photoId: draggedId, sourceCell, moved } = dragState;
  document.querySelectorAll('.cell.dragging, .cell.drag-over').forEach(c => c.classList.remove('dragging', 'drag-over'));
  dragState = null;

  if(moved){
    // A real drag: swap with whatever cell is under the release point.
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const targetCell = el && el.closest('.cell');
    clearSelection();
    if(targetCell && targetCell.dataset.photoId && targetCell.dataset.photoId !== draggedId){
      await swapPhotoOrder(currentAlbumId, draggedId, targetCell.dataset.photoId);
      renderMain();
    }
    return;
  }

  // A simple tap: tap-to-select, tap-a-second-photo-to-swap.
  if(selectedPhotoId === draggedId){
    clearSelection();
  }else if(selectedPhotoId){
    const prevId = selectedPhotoId;
    clearSelection();
    await swapPhotoOrder(currentAlbumId, prevId, draggedId);
    renderMain();
  }else{
    selectedPhotoId = draggedId;
    sourceCell.classList.add('selected');
  }
});

}

/* ---------- Render: album list ---------- */
async function renderAlbumList(){
  const albums = await listAlbums();
  const el = document.getElementById('albumList');
  if(albums.length === 0){
    el.innerHTML = '<div class="empty-sidebar">Aucun album pour l\'instant. Crée ton premier album pour commencer.</div>';
    return;
  }
  el.innerHTML = '';
  for(const album of albums){
    const photos = await listPhotos(album.id);
    const item = document.createElement('div');
    item.className = 'album-item' + (album.id === currentAlbumId ? ' active' : '');
    item.innerHTML = `
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(album.name)}</span>
      <span style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
        <span class="count">${photos.length}</span>
        <button class="del" title="Supprimer l'album">✕</button>
      </span>
    `;
    item.addEventListener('click', (e) => {
      if(e.target.closest('.del')) return;
      currentAlbumId = album.id;
      renderAlbumList();
      renderMain();
      document.getElementById('sidebar').classList.remove('open');
    });
    item.querySelector('.del').addEventListener('click', async () => {
      if(!confirm(`Supprimer l'album "${album.name}" et toutes ses photos ?`)) return;
      await deleteAlbum(album.id);
      if(currentAlbumId === album.id) currentAlbumId = null;
      await renderAlbumList();
      await renderMain();
    });
    el.appendChild(item);
  }
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

/* ---------- Render: main content ---------- */
async function renderMain(){
  const main = document.getElementById('mainContent');
  if(!currentAlbumId){
    main.innerHTML = `
      <div class="main-empty">
        <h2>Sélectionne un album</h2>
        <p>Ou crée-en un nouveau pour commencer à ajouter des photos.</p>
      </div>`;
    return;
  }
  const albums = await listAlbums();
  const album = albums.find(a => a.id === currentAlbumId);
  if(!album){ currentAlbumId = null; return renderMain(); }
  const photos = await listPhotos(album.id);
  const annotated = await annotateOrientations(photos);
  const layouts = computeEffectiveLayouts(album, annotated);

  main.innerHTML = `
    <div class="toolbar">
      <div>
        <h2>${escapeHtml(album.name)}</h2>
        <div class="meta">${photos.length} photo${photos.length>1?'s':''} · ${layouts.length} page${layouts.length !== 1 ? 's':''}</div>
      </div>
      <div class="toolbar-controls">
        <div class="field">
          <label>Format</label>
          <select id="selFormat">
            <option value="a4" ${album.format==='a4'?'selected':''}>A4 portrait</option>
            <option value="carre" ${album.format==='carre'?'selected':''}>Carré</option>
          </select>
        </div>
        <button class="btn btn-amber" id="btnExport" ${photos.length===0?'disabled':''}>Exporter en PDF</button>
      </div>
    </div>

    <div class="drop-zone" id="dropZone">
      <strong>Clique ici</strong> ou dépose des photos pour les ajouter à cet album — elles sont classées par date de prise de vue
    </div>

    <div class="pages ${album.format==='carre'?'fmt-carre':''}" id="pagesEl"></div>
  `;

  document.getElementById('selFormat').addEventListener('change', async (e) => {
    album.format = e.target.value;
    await updateAlbum(album);
    renderMain();
  });
  document.getElementById('btnExport').addEventListener('click', () => exportAlbumToPDF(album));

  const dropZone = document.getElementById('dropZone');
  dropZone.addEventListener('click', () => document.getElementById('fileInput').click());
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    handleFiles(e.dataTransfer.files);
  });

  renderPages(annotated, album, layouts);
}

function renderPages(photos, album, layouts){
  const pagesEl = document.getElementById('pagesEl');
  pagesEl.innerHTML = '';
  selectedPhotoId = null; // DOM is being rebuilt — any pending tap-selection no longer has a visible target
  const pageAspect = pageAspectFor(album.format);
  let cursor = 0;

  layouts.forEach((templateId, pageIndex) => {
    const block = document.createElement('div');
    block.className = 'page-block';

    if(templateId === 'cover'){
      const coverPhoto = photos[cursor];
      cursor += 1;
      const head = document.createElement('div');
      head.className = 'page-head';
      head.innerHTML = `<span class="page-label">Page de couverture</span><button class="btn-add-photo" title="Ajouter une photo">+ Photo</button>`;
      head.querySelector('.btn-add-photo').addEventListener('click', () => document.getElementById('fileInput').click());

      const page = document.createElement('div');
      page.className = 'page cover-page';

      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.position = 'absolute';
      cell.style.inset = '0';
      if(coverPhoto){
        cell.innerHTML = `<img src="${coverPhoto.thumb}" alt="">`;
      }
      const titleEl = document.createElement('div');
      titleEl.className = 'cover-title';
      titleEl.textContent = album.name;

      page.appendChild(cell);
      page.appendChild(titleEl);
      block.appendChild(head);
      block.appendChild(page);
      pagesEl.appendChild(block);
      return;
    }

    const template = TEMPLATES[templateId];
    const slotCount = template.slots.length;
    const slice = photos.slice(cursor, cursor + slotCount);
    cursor += slotCount;
    const assigned = assignPhotosToSlots(slice, template, pageAspect);

    const head = document.createElement('div');
    head.className = 'page-head';
    head.innerHTML = `
      <span class="page-label">Page ${pageIndex + 1}</span>
      <span style="display:flex;gap:8px;align-items:center;">
        <button class="btn-add-photo" title="Ajouter une photo">+ Photo</button>
        <select class="page-select" data-page-index="${pageIndex}">${templateOptionsHtml(templateId)}</select>
      </span>
    `;
    head.querySelector('.btn-add-photo').addEventListener('click', () => document.getElementById('fileInput').click());
    head.querySelector('select').addEventListener('change', async (e) => {
      await setPageTemplate(album, layouts, pageIndex, e.target.value);
      renderMain();
    });

    const page = document.createElement('div');
    page.className = 'page';
    page.style.gridTemplateColumns = `repeat(${template.cols}, 1fr)`;
    page.style.gridTemplateRows = `repeat(${template.rows}, 1fr)`;

    template.slots.forEach(([c0,c1,r0,r1], slotIdx) => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.gridColumn = `${c0} / ${c1}`;
      cell.style.gridRow = `${r0} / ${r1}`;
      const photo = assigned[slotIdx];
      if(!photo) cell.classList.add('cell-empty');
      if(photo){
        cell.dataset.photoId = photo.id;
        cell.innerHTML = `<img src="${photo.thumb}" alt=""><button class="rm">✕</button>`;
        attachDragHandlers(cell, photo.id);
        cell.querySelector('.rm').addEventListener('click', async (e) => {
          e.stopPropagation();
          await deletePhoto(photo.id);
          toast('Photo supprimée');
          renderMain();
          renderAlbumList();
        });
      }
      page.appendChild(cell);
    });

    block.appendChild(head);
    block.appendChild(page);
    pagesEl.appendChild(block);
  });
}

// Changing one page's template changes how many slots it holds, which
// shifts every following page. We persist the explicit choice for this page
// (and every page before it, so their layouts don't silently drift) and let
// computeEffectiveLayouts regenerate whatever comes after with the default.
async function setPageTemplate(album, currentLayouts, pageIndex, newTemplateId){
  // currentLayouts[0] is always the fixed cover page and never stored in
  // album.pageLayouts (which only tracks the grid pages after it).
  const kept = currentLayouts.slice(1, pageIndex);
  kept.push(newTemplateId);
  album.pageLayouts = kept;
  await updateAlbum(album);
}

async function swapPhotoOrder(albumId, draggedId, targetId){
  const photos = await listPhotos(albumId);
  const fromIdx = photos.findIndex(p => p.id === draggedId);
  const toIdx = photos.findIndex(p => p.id === targetId);
  if(fromIdx === -1 || toIdx === -1) return;
  const [moved] = photos.splice(fromIdx, 1);
  photos.splice(toIdx, 0, moved);
  await reorderPhotos(photos);
}

/* ---------- Adding photos ---------- */
async function handleFiles(fileList){
  const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
  if(files.length === 0) return;
  toast(`Ajout de ${files.length} photo${files.length>1?'s':''}…`);

  const prepared = [];
  for(const [i, file] of files.entries()){
    try{
      const [thumb, takenAt] = await Promise.all([makeThumbnail(file), getPhotoDate(file)]);
      prepared.push({
        id: crypto.randomUUID(),
        albumId: currentAlbumId,
        blob: file,
        thumb,
        takenAt,
        order: i, // placeholder — reorderPhotos() overwrites this right after upload; the column is NOT NULL so it can't be left unset at insert time
        name: file.name
      });
    }catch(err){
      console.error('Échec de préparation', file.name, err);
    }
  }

  // Merge into the existing order, sorted by capture date — this is what
  // places new photos "à la bonne page" automatically, like Cheerz. A
  // manual drag afterwards is a free override of this order, per photo.
  const existing = await listPhotos(currentAlbumId);
  if(prepared.length === 0){
    toast('Échec : impossible de lire ces photos');
    return;
  }

  // Each photo is uploaded independently — one failure (réseau, format...)
  // must not silently discard every other photo in the same batch.
  let okCount = 0, failCount = 0;
  const succeeded = [];
  for(const p of prepared){
    try{
      await addPhoto(p);
      succeeded.push(p);
      okCount++;
    }catch(err){
      console.error('Échec envoi', p.name, err);
      failCount++;
    }
  }
  const finalOrder = existing.concat(succeeded).sort((a,b) => a.takenAt - b.takenAt);
  if(finalOrder.length) await reorderPhotos(finalOrder);

  toast(failCount === 0
    ? `${okCount} photo${okCount>1?'s':''} ajoutée${okCount>1?'s':''}`
    : `${okCount} ajoutée${okCount>1?'s':''}, ${failCount} échec${failCount>1?'s':''}`);
  renderMain();
  renderAlbumList();
}

document.getElementById('fileInput').addEventListener('change', (e) => {
  handleFiles(e.target.files);
  e.target.value = '';
});

/* ---------- PDF export ---------- */
const PAGE_DIMS = { // mm
  a4: {w: 210, h: 297},
  carre: {w: 210, h: 210}
};
// Converts a template's grid-line slot coordinates into millimetre rects
// on the physical page, honoring the same margin/gutter used on screen.
function slotsToRects(template, pageW, pageH, margin, gutter){
  const unitW = (pageW - margin*2 - gutter*(template.cols-1)) / template.cols;
  const unitH = (pageH - margin*2 - gutter*(template.rows-1)) / template.rows;
  return template.slots.map(([c0,c1,r0,r1]) => ({
    x: margin + (c0-1) * (unitW + gutter),
    y: margin + (r0-1) * (unitH + gutter),
    w: (c1-c0) * unitW + (c1-c0-1) * gutter,
    h: (r1-r0) * unitH + (r1-r0-1) * gutter
  }));
}

async function exportAlbumToPDF(album){
  const rawPhotos = await listPhotos(album.id);
  if(rawPhotos.length === 0) return;
  toast('Génération du PDF…');
  const photos = await annotateOrientations(rawPhotos);
  const dims = PAGE_DIMS[album.format];
  const pageAspect = dims.w / dims.h;
  const layouts = computeEffectiveLayouts(album, photos);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: dims.w > dims.h ? 'landscape' : 'portrait', unit: 'mm', format: [dims.w, dims.h] });
  const margin = 0, gutter = 3;

  let cursor = 0;
  for(let p = 0; p < layouts.length; p++){
    if(p > 0) doc.addPage([dims.w, dims.h]);

    if(layouts[p] === 'cover'){
      const photo = photos[cursor];
      cursor += 1;
      if(photo){
        try{
          const blob = await downloadPhotoBlob(photo);
          const { dataUrl } = await makePrintImage(blob);
          doc.addImage(dataUrl, 'JPEG', 0, 0, dims.w, dims.h, undefined, 'FAST');
        }catch(err){ console.error('Image de couverture ignorée', err); }
      }
      const bandH = 26;
      doc.setFillColor(44, 66, 87);
      doc.rect(0, dims.h - bandH, dims.w, bandH, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(20);
      doc.text(album.name, dims.w/2, dims.h - bandH/2 + 4, { align: 'center' });
      doc.setTextColor(0, 0, 0);
      continue;
    }

    const template = TEMPLATES[layouts[p]];
    const rects = slotsToRects(template, dims.w, dims.h, margin, gutter);
    const slice = photos.slice(cursor, cursor + template.slots.length);
    cursor += template.slots.length;
    const assigned = assignPhotosToSlots(slice, template, pageAspect);

    for(let i = 0; i < assigned.length; i++){
      const photo = assigned[i];
      if(!photo) continue;
      const r = rects[i];
      try{
        const blob = await downloadPhotoBlob(photo);
        const { dataUrl } = await makePrintImage(blob);
        doc.addImage(dataUrl, 'JPEG', r.x, r.y, r.w, r.h, undefined, 'FAST');
      }catch(err){
        console.error('Image ignorée dans le PDF', photo.name, err);
      }
    }
  }

  doc.save(`${album.name.replace(/[^a-z0-9]+/gi,'_')}.pdf`);
  toast('PDF téléchargé');
}

modalBackdrop.addEventListener('click', (e) => { if(e.target === modalBackdrop) modalBackdrop.classList.remove('show'); });
document.getElementById('confirmNewAlbum').addEventListener('click', createNewAlbum);
document.getElementById('newAlbumName').addEventListener('keydown', (e) => { if(e.key === 'Enter') createNewAlbum(); });

async function createNewAlbum(){
  const name = document.getElementById('newAlbumName').value.trim();
  if(!name) return;
  const album = await createAlbum(name);
  currentAlbumId = album.id;
  modalBackdrop.classList.remove('show');
  await renderAlbumList();
  await renderMain();
}

/* ---------- Mobile sidebar toggle ---------- */
document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});

/* ---------- Shared photos inbox (from the Android "Partager" sheet) ---------- */
function openInboxDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('photobook-share-inbox', 1);
    req.onupgradeneeded = (e) => {
      e.target.result.createObjectStore('incoming', { keyPath: 'id', autoIncrement: true });
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e);
  });
}
async function readInboxFiles(){
  const db = await openInboxDB();
  return new Promise((resolve, reject) => {
    const store = db.transaction('incoming', 'readonly').objectStore('incoming');
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result.map(r => new File([r.buf], r.name || 'photo.jpg', { type: r.type || 'image/jpeg' })));
    req.onerror = reject;
  });
}
async function clearInbox(){
  const db = await openInboxDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('incoming', 'readwrite');
    tx.objectStore('incoming').clear();
    tx.oncomplete = resolve;
    tx.onerror = reject;
  });
}

async function checkSharedPhotos(){
  if(!location.search.includes('shared=1')) return;
  history.replaceState(null, '', location.pathname);
  let files;
  try{ files = await readInboxFiles(); }catch(e){ return; }
  if(!files || files.length === 0) return;

  const albums = await listAlbums();
  const sel = document.getElementById('shareImportAlbum');
  sel.innerHTML = albums.map(a => `<option value="${a.id}">${escapeHtml(a.name)}</option>`).join('')
    + `<option value="__new__">+ Nouvel album</option>`;
  document.getElementById('shareImportTitle').textContent =
    `${files.length} photo${files.length>1?'s':''} partagée${files.length>1?'s':''}`;
  document.getElementById('shareImportBackdrop').classList.add('show');

  document.getElementById('shareImportCancel').onclick = async () => {
    await clearInbox();
    document.getElementById('shareImportBackdrop').classList.remove('show');
  };
  document.getElementById('shareImportConfirm').onclick = async () => {
    let targetId = sel.value;
    if(targetId === '__new__'){
      const name = `Photos partagées ${new Date().toLocaleDateString('fr-FR')}`;
      const album = await createAlbum(name);
      targetId = album.id;
    }
    currentAlbumId = targetId;
    document.getElementById('shareImportBackdrop').classList.remove('show');
    await clearInbox();
    await renderAlbumList();
    await renderMain();
    await handleFiles(files);
  };
}

/* ---------- Init ---------- */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

(async function init(){
  fillSprockets();
  initSupabaseClient();

  const { data: { session } } = await supabaseClient.auth.getSession();
  if(session){
    showApp();
  }else{
    showLogin();
  }

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if(event === 'SIGNED_IN') showApp();
    if(event === 'SIGNED_OUT') showLogin();
  });
})();

function showLogin(msg){
  document.getElementById('loginScreen').classList.add('show');
  document.querySelector('.app').style.display = 'none';
  if(msg) document.getElementById('loginError').textContent = msg;
}
async function showApp(){
  document.getElementById('loginScreen').classList.remove('show');
  document.querySelector('.app').style.display = 'flex';
  await renderAlbumList();
  await renderMain();
  await checkSharedPhotos();
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  document.getElementById('loginError').textContent = '';
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error) document.getElementById('loginError').textContent = 'Identifiants incorrects.';
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await supabaseClient.auth.signOut();
});
</script>
